<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f10"><meta name="robots" content="noindex"><title>Демо сайтов автосервисов</title>
<style>
:root{--bg:#0f0f10;--card:#1a1a1c;--line:rgba(255,255,255,.12);--text:#f3f3f1;--muted:#a6a6a3;--acc:#f5c518}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px 48px}
main{max-width:640px;margin:0 auto}h1{font-size:24px;margin:8px 0 6px}p{color:var(--muted);margin:0 0 20px}
a.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;color:inherit;text-decoration:none}
a.card:active{border-color:var(--acc)}a.card img{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none}
b{display:block;font-size:18px}span{color:var(--muted);font-size:14px}i{margin-left:auto;color:var(--acc);font-style:normal;font-size:22px}
